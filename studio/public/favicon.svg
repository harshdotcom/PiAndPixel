<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dark background fill -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1d23"/>
      <stop offset="100%" stop-color="#141519"/>
    </linearGradient>
    <!-- Accent gradient (cyan to blue) -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58c4dd"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <!-- Pixel square gradient -->
    <linearGradient id="pixGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#83c167"/>
      <stop offset="100%" stop-color="#58c4dd"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bgGrad)"/>

  <!-- π symbol (Pi) — drawn as two vertical strokes + crossbar -->
  <!-- Crossbar -->
  <rect x="11" y="18" width="22" height="3.2" rx="1.6" fill="url(#accentGrad)"/>
  <!-- Left leg -->
  <rect x="13" y="18" width="3.2" height="20" rx="1.6" fill="url(#accentGrad)"/>
  <!-- Right leg with curve hint: two rects faking a rounded bottom -->
  <rect x="26.8" y="18" width="3.2" height="16" rx="1.6" fill="url(#accentGrad)"/>
  <rect x="26.8" y="31" width="5" height="3.2" rx="1.6" fill="url(#accentGrad)"/>

  <!-- Pixel cluster — 2×2 grid of squares bottom-right -->
  <rect x="35" y="30" width="7.5" height="7.5" rx="1.8" fill="url(#pixGrad)" opacity="1"/>
  <rect x="44" y="30" width="7.5" height="7.5" rx="1.8" fill="url(#pixGrad)" opacity="0.8"/>
  <rect x="35" y="39" width="7.5" height="7.5" rx="1.8" fill="url(#pixGrad)" opacity="0.6"/>
  <rect x="44" y="39" width="7.5" height="7.5" rx="1.8" fill="url(#pixGrad)" opacity="0.4"/>

  <!-- Dot between π and pixel cluster — separating ampersand -->
  <circle cx="32.5" cy="44" r="2" fill="#58c4dd" opacity="0.7"/>
</svg>

