[project]
name = "pnp-core"
version = "0.1.0"
description = "Headless Pi & Pixel render pipeline (no web dependencies)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pnp_core"]
