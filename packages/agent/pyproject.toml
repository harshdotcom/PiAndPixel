[project]
name = "pnp-agent"
version = "0.1.0"
description = "Pi & Pixel Agent: local API, job runner and Studio host."
requires-python = ">=3.12"
dependencies = [
    "pnp-core",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=17.3",
]

[project.scripts]
pnp = "pnp_agent.cli:main"

[tool.uv.sources]
pnp-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pnp_agent"]
