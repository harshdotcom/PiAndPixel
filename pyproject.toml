[project]
name = "piandpixel"
version = "0.1.0"
description = "Pi & Pixel: code-first studio for Manim explainer videos"
requires-python = ">=3.12,<3.13"
dependencies = ["pnp-sdk", "pnp-core", "pnp-agent"]

[tool.uv.sources]
pnp-sdk = { workspace = true }
pnp-core = { workspace = true }
pnp-agent = { workspace = true }

[tool.uv.workspace]
members = ["packages/sdk", "packages/core", "packages/agent"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Code blocks in docs are illustrative; keep their hand alignment.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["packages/sdk/tests", "packages/core/tests", "packages/agent/tests"]
markers = ["render: needs manim + ffmpeg on PATH (slow)"]
addopts = "-m 'not render'"

[tool.pyright]
include = ["packages"]
exclude = ["**/node_modules", "**/.venv"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["packages/core/src", "packages/sdk/src"]
